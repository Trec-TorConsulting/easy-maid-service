[project]
name = "easy_maid"
authors = [
    { name = "Easy Maid Service", email = "trecto28@gmail.com" }
]
description = "Cleaning-company back-office and customer portal on Frappe/ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

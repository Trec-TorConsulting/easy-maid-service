apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-worker-default
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: worker-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: easymaid
      app.kubernetes.io/component: worker-default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easymaid
        app.kubernetes.io/component: worker-default
    spec:
      initContainers:
      - name: seed-sites
        image: frappe/erpnext:version-16
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true"]
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: write-common-config
        image: busybox:1.36
        command: ["/bin/sh", "-c", "cp /config/common_site_config.json /mnt/sites/common_site_config.json"]
        volumeMounts:
        - name: common-config
          mountPath: /config
        - name: sites
          mountPath: /mnt/sites
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
                - node06
      containers:
      - name: worker-default
        image: frappe/erpnext:version-16
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c", "mkdir -p /home/frappe/logs && cd /home/frappe/frappe-bench && bench worker --queue default"]
        envFrom:
        - configMapRef:
            name: easymaid-common-config
        env:
        - name: FRAPPE_SITE_NAME_HEADER
          valueFrom:
            secretKeyRef:
              name: easymaid-secrets
              key: site-name
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: easymaid-sites-pvc
      - name: common-config
        configMap:
          name: easymaid-common-config
          items:
          - key: common_site_config.json
            path: common_site_config.json
---

apiVersion: v1
kind: Secret
metadata:
  name: easymaid-secrets
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: secrets
stringData:
  # Database credentials
  mariadb-root-password: "REPLACE_WITH_STRONG_ROOT_PASSWORD"
  mariadb-user: "frappe"
  mariadb-password: "REPLACE_WITH_STRONG_DB_PASSWORD"
  mariadb-database: "easymaid"

  # Frappe site bootstrap
  site-name: "easymaid.trector.com"
  administrator-password: "REPLACE_WITH_STRONG_ADMIN_PASSWORD"
  encryption-key: "REPLACE_WITH_32_CHAR_HEX_KEY"

  # Stripe (hosted checkout)
  stripe-publishable-key: "pk_live_or_test_REPLACE_ME"
  stripe-secret-key: "sk_live_or_test_REPLACE_ME"
  stripe-webhook-secret: "whsec_REPLACE_ME"

  # App source for bench get-app (must be a repo with easy_maid app at repo root)
  easy-maid-app-repo-url: "https://github.com/YOUR_ORG/easy_maid.git"

  # Optional: mail relay credentials
  smtp-host: "smtp.example.com"
  smtp-user: "mailer@example.com"
  smtp-password: "REPLACE_ME"

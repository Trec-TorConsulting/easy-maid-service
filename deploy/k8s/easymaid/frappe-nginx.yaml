apiVersion: v1
kind: Service
metadata:
  name: frappe-nginx
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: nginx
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/component: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-nginx
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: easymaid
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easymaid
        app.kubernetes.io/component: nginx
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
                - node06
      # nginx master writes /run/nginx.pid (root-owned) — run frontend as root,
      # matching the stock frappe_docker nginx frontend behaviour.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
      - name: frappe-nginx
        image: frappe/erpnext:version-16
        imagePullPolicy: IfNotPresent
        command: ["nginx-entrypoint.sh"]
        env:
        - name: BACKEND
          value: frappe-python:8000
        - name: SOCKETIO
          value: frappe-socketio:9000
        - name: FRAPPE_SITE_NAME_HEADER
          valueFrom:
            secretKeyRef:
              name: easymaid-secrets
              key: site-name
        - name: UPSTREAM_REAL_IP_HEADER
          value: X-Forwarded-For
        - name: UPSTREAM_REAL_IP_RECURSIVE
          value: "on"
        - name: PROXY_READ_TIMEOUT
          value: "120"
        - name: CLIENT_MAX_BODY_SIZE
          value: 50m
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/method/ping
            port: http
            httpHeaders:
            - name: Host
              value: easymaid.trector.com
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: easymaid-sites-pvc

apiVersion: batch/v1
kind: Job
metadata:
  name: easymaid-site-init
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: site-init
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easymaid
        app.kubernetes.io/component: site-init
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
                - node06
      initContainers:
      - name: seed-sites
        image: frappe/erpnext:version-16
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true"]
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: write-common-config
        image: busybox:1.36
        command: ["/bin/sh", "-c", "cp /config/common_site_config.json /mnt/sites/common_site_config.json"]
        volumeMounts:
        - name: common-config
          mountPath: /config
        - name: sites
          mountPath: /mnt/sites
      containers:
      - name: site-init
        image: frappe/erpnext:version-16
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          cd /home/frappe/frappe-bench

          SITE_DIR="sites/${SITE_NAME}"

          # Recover from interrupted new-site runs that created a partial directory.
          if [ -d "${SITE_DIR}" ] && [ ! -f "${SITE_DIR}/site_config.json" ]; then
            echo "Found incomplete site directory ${SITE_DIR}; removing for clean bootstrap"
            rm -rf "${SITE_DIR}"
          fi

          if [ -d "${SITE_DIR}" ]; then
            echo "Site ${SITE_NAME} already exists, skipping new-site"
          else
            bench new-site "${SITE_NAME}" \
              --db-root-username root \
              --db-root-password "${DB_ROOT_PASSWORD}" \
              --mariadb-root-password "${DB_ROOT_PASSWORD}" \
              --mariadb-user-host-login-scope="%" \
              --admin-password "${ADMIN_PASSWORD}" \
              --install-app erpnext
          fi

          # easy_maid is baked into the custom bench image (see ./Dockerfile),
          # so it is already present under apps/ and pip-installed. If it is ever
          # absent (e.g. running on the stock image), fall back to get-app.
          if [ ! -d "apps/easy_maid" ]; then
            if echo "${EASY_MAID_APP_REPO_URL:-}" | grep -q "YOUR_ORG/easy_maid.git"; then
              echo "Skipping easy_maid get-app: EASY_MAID_APP_REPO_URL is placeholder"
            elif [ -n "${EASY_MAID_APP_REPO_URL:-}" ]; then
              bench get-app easy_maid "${EASY_MAID_APP_REPO_URL}"
            fi
          fi

          # Ensure easy_maid is registered in the shared (PVC) apps.txt.
          if [ -d "apps/easy_maid" ]; then
            touch sites/apps.txt
            awk 'NF' sites/apps.txt > /tmp/apps.txt || true
            grep -qxF easy_maid /tmp/apps.txt 2>/dev/null || echo easy_maid >> /tmp/apps.txt
            mv /tmp/apps.txt sites/apps.txt
            echo "apps.txt: $(tr '\n' ' ' < sites/apps.txt)"
          fi

          if bench --site "${SITE_NAME}" list-apps | grep -qx "easy_maid"; then
            echo "easy_maid already installed on ${SITE_NAME}"
          elif [ -d "apps/easy_maid" ]; then
            bench --site "${SITE_NAME}" install-app easy_maid
          else
            echo "Skipping easy_maid install: app source not available"
          fi

          # Apply any pending schema/patches for installed apps.
          if [ -d "apps/easy_maid" ]; then
            bench --site "${SITE_NAME}" migrate
          fi

          # Materialize a single, concrete copy of built assets onto the shared
          # RWX PVC. Every frappe workload now runs one immutable custom image,
          # so all pods share identical assets (no per-node hash drift). We copy
          # in place (no destructive `rm -rf sites/assets`) to avoid racing with
          # running pods that read this dir on the RWX volume during a rollout.
          echo "Materializing shared assets on PVC"
          mkdir -p sites/assets
          cp -aL /home/frappe/frappe-bench/assets/. sites/assets/

          # bench build does not place the custom app's link in the bench-level
          # assets dir, so copy easy_maid's public dir explicitly. This is what
          # backs /assets/easy_maid/* (including the prebuilt Vue frontend).
          if [ -d apps/easy_maid/easy_maid/public ]; then
            mkdir -p sites/assets/easy_maid
            cp -aL apps/easy_maid/easy_maid/public/. sites/assets/easy_maid/
          fi

          echo "site-init complete"
        env:
        - name: SITE_NAME
          valueFrom:
            secretKeyRef:
              name: easymaid-secrets
              key: site-name
        - name: DB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: easymaid-secrets
              key: mariadb-root-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: easymaid-secrets
              key: administrator-password
        - name: EASY_MAID_APP_REPO_URL
          valueFrom:
            secretKeyRef:
              name: easymaid-secrets
              key: easy-maid-app-repo-url
        envFrom:
        - configMapRef:
            name: easymaid-common-config
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: easymaid-sites-pvc
      - name: common-config
        configMap:
          name: easymaid-common-config
          items:
          - key: common_site_config.json
            path: common_site_config.json

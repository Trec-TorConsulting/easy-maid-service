apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: redis-queue
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/component: redis-queue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
  namespace: easymaid
  labels:
    app.kubernetes.io/name: easymaid
    app.kubernetes.io/part-of: easy-maid-service
    app.kubernetes.io/component: redis-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: easymaid
      app.kubernetes.io/component: redis-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easymaid
        app.kubernetes.io/component: redis-queue
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
                - node06
      containers:
      - name: redis-queue
        image: redis:8-alpine
        args: ["--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Easy Maid Service — isolated ERPNext instance (namespace: easymaid)
# Add resources here as they are created. Keep ordering sensible:
# namespace -> config/secrets -> data (mariadb/redis) -> app -> ingress -> jobs.
namespace: easymaid

resources:
  - namespace.yaml
  - configmap.yaml
  # - secret.yaml            # generate from secret.example.yaml with real values
  - networkpolicy.yaml
  - mariadb.yaml
  - redis-cache.yaml
  - redis-queue.yaml
  - redis-socketio.yaml
  - pvc-sites.yaml
  - frappe-python.yaml
  - frappe-nginx.yaml
  - frappe-socketio.yaml
  - frappe-workers.yaml
  - frappe-scheduler.yaml
  - ingress.yaml
  - site-init-job.yaml
  - backup-cronjob.yaml
  - pdb.yaml

# Custom bench image with the easy_maid app baked in (built from ./Dockerfile and
# pushed to the local cluster registry). A single immutable image for every
# frappe workload also removes the asset-hash drift of the rolling upstream tag.
images:
  - name: frappe/erpnext
    newName: 192.168.4.10:30500/easy-maid-service/bench
    newTag: "0.1.4"
